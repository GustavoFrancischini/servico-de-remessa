micronaut:
  application:
    name: servico-remessa
  server:
    port: 8080

datasources:
  default:
    url: jdbc:h2:mem:remessaDb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;NON_KEYWORDS=USER
    driverClassName: org.h2.Driver
    username: sa
    password: ""
    schema-generate: NONE
    dialect: H2

flyway:
  datasources:
    default:
      enabled: true
      locations: classpath:db/migration
